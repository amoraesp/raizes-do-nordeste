<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">


<title>
    Entrar | Raízes do Nordeste
</title>


<!-- Fonte -->

<link rel="preconnect"
    href="https://fonts.googleapis.com">

<link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>


<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


<!-- Ícones -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

    * {

        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family:
            'Poppins',
            Arial,
            sans-serif;

    }


    body {

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #fff8ed,
                #f6dfbd
            );

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 20px;

    }


    .container {

        width: 100%;

        max-width: 420px;

        background: white;

        padding: 40px;

        border-radius: 24px;

        text-align: center;

        box-shadow:
            0 15px 40px
            rgba(70, 45, 25, 0.15);

    }


    .icone {

        width: 80px;

        height: 80px;

        margin:
            0 auto 20px;

        border-radius: 50%;

        background: #fff0df;

        color: #d35400;

        display: flex;

        justify-content: center;

        align-items: center;

        font-size: 32px;

    }


    h1 {

        color: #5d3218;

        font-size: 28px;

        margin-bottom: 10px;

    }


    .descricao {

        color: #777;

        font-size: 14px;

        margin-bottom: 28px;

    }


    form {

        width: 100%;

    }


    .campo-container {

        position: relative;

        margin-bottom: 15px;

    }


    .campo-container i {

        position: absolute;

        left: 15px;

        top: 50%;

        transform:
            translateY(-50%);

        color: #c58a5a;

    }


    .campo {

        width: 100%;

        padding:
            14px 15px 14px 45px;

        border:
            1px solid #ddd;

        border-radius: 10px;

        font-size: 15px;

        outline: none;

        transition: 0.2s;

    }


    .campo:focus {

        border-color: #d35400;

        box-shadow:
            0 0 0 3px
            rgba(211, 84, 0, 0.08);

    }


    .botao {

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 30px;

        background: #d35400;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.3s;

        margin-top: 5px;

    }


    .botao:hover {

        background: #a84300;

        transform:
            translateY(-2px);

    }


    .cadastro {

        margin-top: 22px;

        color: #777;

        font-size: 14px;

    }


    .cadastro a {

        color: #d35400;

        text-decoration: none;

        font-weight: 600;

    }


    .cadastro a:hover {

        text-decoration: underline;

    }


    .voltar {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        margin-top: 25px;

        text-decoration: none;

        color: #777;

        font-size: 14px;

    }


    .voltar:hover {

        color: #d35400;

    }


    @media (max-width: 500px) {

        .container {

            padding:
                30px 22px;

        }


        h1 {

            font-size: 24px;

        }

    }
    /* =========================
   LGPD
========================= */

.lgpd {
    text-align: left;
    margin: 5px 0 20px;
    padding: 14px;
    background: #fff8ed;
    border: 1px solid #f0dfc7;
    border-radius: 12px;
}

.lgpd-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    color: #555;
    font-size: 12px;
    line-height: 1.5;
}

.lgpd-check input {
    width: 18px;
    height: 18px;
    min-width: 18px;
    margin: 2px 0 0;
    accent-color: #e65100;
    cursor: pointer;
}

.lgpd-info {
    color: #888;
    font-size: 11px;
    line-height: 1.5;
    margin: 10px 0 0;
}

</style>


</head>

<body>

<div class="container">


<!-- ÍCONE -->

<div class="icone">

    <i class="fa-solid fa-lock"></i>

</div>



<h1>

    Bem-vindo!

</h1>



<p class="descricao">

    Entre na sua conta para continuar.

</p>



<!-- FORMULÁRIO -->

<form onsubmit="login(event)">


    <div class="campo-container">

        <i class="fa-solid fa-envelope"></i>


        <input
            type="email"
            id="email"
            class="campo"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required>

    </div>



    <div class="campo-container">

        <i class="fa-solid fa-lock"></i>


        <input
            type="password"
            id="senha"
            class="campo"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required>

    </div>


    <div class="lgpd">

    <label class="lgpd-check">

        <input
            type="checkbox"
            id="aceiteLGPD"
            required
        >

        <span>
            Li e concordo com o aviso de privacidade
            e autorizo o uso dos meus dados para
            identificação, processamento dos pedidos
            e participação no programa de fidelidade.
        </span>

    </label>

    <p class="lgpd-info">
        Seus dados serão utilizados somente para
        as finalidades relacionadas ao funcionamento
        da plataforma.
    </p>

</div>
    <button
        type="submit"
        class="botao">

        <i class="fa-solid fa-right-to-bracket"></i>

        Entrar

    </button>


</form>



<div class="cadastro">

    Ainda não possui conta?

    <a href="cadastro.html">
    Criar cadastro
</a>

</div>



<a
    href="index.html"
    class="voltar">

    <i class="fa-solid fa-arrow-left"></i>

    Voltar para Home

</a>


</div>

<!-- JavaScript -->

<script
    src="js/script.js">
</script>

</body>

</html>
