
<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">


<title>
    Fidelidade | Raízes do Nordeste
</title>


<!-- Fonte -->

<link rel="preconnect"
    href="https://fonts.googleapis.com">

<link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>


<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


<!-- Ícones -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

    * {

        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family:
            'Poppins',
            Arial,
            sans-serif;

    }


    body {

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #fff8ed,
                #f6dfbd
            );

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 30px;

    }


    .container {

        width: 100%;

        max-width: 520px;

        background: white;

        padding: 40px;

        border-radius: 24px;

        text-align: center;

        box-shadow:
            0 15px 40px
            rgba(70, 45, 25, 0.15);

    }


    .icone {

        width: 80px;

        height: 80px;

        margin:
            0 auto 20px;

        border-radius: 50%;

        background: #fff0df;

        color: #d35400;

        display: flex;

        justify-content: center;

        align-items: center;

        font-size: 36px;

    }


    h1 {

        color: #5d3218;

        font-size: 28px;

        margin-bottom: 10px;

    }


    .descricao {

        color: #777;

        font-size: 15px;

        line-height: 1.6;

        margin-bottom: 25px;

    }


    .pontos {

        background: #fff8ed;

        border:
            1px solid #f0dfc7;

        padding: 25px;

        border-radius: 16px;

        margin-bottom: 25px;

    }


    .pontos i {

        color: #d35400;

        font-size: 20px;

        margin-bottom: 8px;

    }


    .pontos h2 {

        color: #d35400;

        font-size: 42px;

        line-height: 1;

        margin-bottom: 5px;

    }


    .pontos span {

        color: #777;

        font-size: 13px;

    }


    .recompensas {

        text-align: left;

        margin-bottom: 25px;

    }


    .recompensas h3 {

        color: #5d3218;

        font-size: 17px;

        margin-bottom: 15px;

    }


    .recompensas h3 i {

        color: #d35400;

        margin-right: 7px;

    }


    .item {

        display: flex;

        align-items: center;

        gap: 12px;

        background: #fafafa;

        padding: 15px;

        margin-bottom: 10px;

        border-radius: 12px;

        border:
            1px solid #eeeeee;

        transition: 0.2s;

    }


    .item:hover {

        transform:
            translateX(3px);

        border-color:
            #e7c9a7;

    }


    .icone-recompensa {

        width: 38px;

        height: 38px;

        min-width: 38px;

        border-radius: 50%;

        background: #fff0df;

        color: #d35400;

        display: flex;

        justify-content: center;

        align-items: center;

    }


    .item strong {

        display: block;

        color: #4a4a4a;

        font-size: 14px;

    }


    .item span {

        color: #888;

        font-size: 12px;

    }


    .botao {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        width: 100%;

        text-decoration: none;

        background: #d35400;

        color: white;

        padding: 14px 28px;

        border-radius: 30px;

        font-size: 15px;

        font-weight: 600;

        transition: 0.3s;

    }


    .botao:hover {

        background: #a84300;

        transform:
            translateY(-2px);

    }


    @media (max-width: 500px) {

        body {

            padding: 15px;

        }


        .container {

            padding:
                30px 20px;

        }


        h1 {

            font-size: 24px;

        }

    }

</style>


</head>

<body>

<div class="container">


<!-- ÍCONE -->

<div class="icone">

    <i class="fa-solid fa-star"></i>

</div>


<h1>

    Clube de Fidelidade

</h1>


<p class="descricao">

    Acumule pontos a cada pedido
    e troque por benefícios exclusivos.

</p>



<!-- PONTOS -->

<div class="pontos">

    <i class="fa-solid fa-award"></i>


    <h2 id="pontos">

        0

    </h2>


    <span>

        pontos disponíveis

    </span>

</div>



<!-- RECOMPENSAS -->

<div class="recompensas">


    <h3>

        <i class="fa-solid fa-gift"></i>

        Recompensas

    </h3>



    <div class="item">


        <div class="icone-recompensa">

            <i
                class="fa-solid fa-burger">
            </i>

        </div>


        <div>

            <strong>

                Hambúrguer grátis

            </strong>


            <span>

                500 pontos

            </span>

        </div>


    </div>



    <div class="item">


        <div class="icone-recompensa">

            <i
                class="fa-solid fa-glass-water">
            </i>

        </div>


        <div>

            <strong>

                Bebida grátis

            </strong>


            <span>

                300 pontos

            </span>

        </div>


    </div>



    <div class="item">


        <div class="icone-recompensa">

            <i
                class="fa-solid fa-utensils">
            </i>

        </div>


        <div>

            <strong>

                Porção de batata

            </strong>


            <span>

                150 pontos

            </span>

        </div>


    </div>


</div>



<!-- VOLTAR -->

<a
    href="index.html"
    class="botao">

    <i
        class="fa-solid fa-house">
    </i>

    Voltar para Home

</a>


</div>

<!-- JavaScript -->

<script
    src="js/script.js">
</script>

</body>

</html>
