    </title>


    <!-- =========================
         FONTE
    ========================== -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- =========================
         ÍCONES
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="container">

            <div class="logo">

                <h1>
                    Raízes do Nordeste
                </h1>

                <p>
                    Sabores que contam histórias.
                </p>

            </div>


            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="cardapio.html">
                    Cardápio
                </a>

                <a href="fidelidade.html">
                    Fidelidade
                </a>

                <a href="carrinho.html">
                    Carrinho
                </a>


                <span id="usuarioMenu">

                    <a href="login.html">

                        <i class="fa-solid fa-user"></i>

                        Entrar

                    </a>

                </span>

            </nav>

        </div>

    </header>



    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main>

        <section class="container cardapio">


            <!-- =========================
                 TÍTULO
            ========================== -->

            <div class="titulo-pagina">

                <h2>
                    Nosso Cardápio
                </h2>

                <p>
                    Escolha seu prato favorito e aproveite
                    o melhor da culinária nordestina.
                </p>

            </div>



            <!-- =========================
                 ESCOLHA DA UNIDADE
            ========================== -->

            <div class="unidade-container">

                <label for="unidade">
                    Escolha sua unidade:
                </label>

                <select
                    id="unidade"
                    onchange="carregarCardapio()">

                    <option value="recife">
                        Recife
                    </option>

                    <option value="olinda">
                        Olinda
                    </option>

                    <option value="jaboatao">
                        Jaboatão
                    </option>

                </select>

            </div>



            <!-- =========================
                 PRODUTOS
            ========================== -->

            <div
                id="listaProdutos"
                class="cards">

            </div>


        </section>

    </main>



    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        <p>
            © 2026 - Raízes do Nordeste |
            Sabores que contam histórias.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/script.js"></script>
